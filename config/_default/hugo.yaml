############################
## CHANGE THESE
############################

baseURL: "https://gujarats.github.io/blog"
title: "Tech Blog"

############################
## MISC
############################

enableEmoji: true
disableKinds: ["taxonomy", "term"]
languageCode: "en-us"
enableRobotsTXT: true

############################
## Bypass the home page directly to blog path
############################

permalinks:
  section:
    blog: /
  page:
    blog: :title

markup:
  tableOfContents:
    endLevel: 3
    ordered: true
    startLevel: 1

